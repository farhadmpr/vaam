name: Build and Release Flutter APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Get app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')

          VERSION_NAME="${VERSION%%+*}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "App version: $VERSION_NAME"
          echo "GitHub run number: $GITHUB_RUN_NUMBER"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
          build/app/outputs/flutter-apk/vaam-${{ steps.version.outputs.version_name }}-build.${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: vaam-apk-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/vaam-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-build.${{ github.run_number }}
          name: VAAM v${{ steps.version.outputs.version_name }} - Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/vaam-*.apk